name: MeiweiAssistant
options:
  bundleIdPrefix: cn.hnchpower
  deploymentTarget:
    iOS: "17.0"
targets:
  MeiweiAssistant:
    type: application
    platform: iOS
    sources:
      - path: MeiweiAssistant
        excludes:
          - Assets.xcassets
          - Assets.scnassets
          - title-catalog.json
          - Info.plist
    resources:
      - path: MeiweiAssistant/Assets.xcassets
      - path: MeiweiAssistant/Assets.scnassets
      - path: MeiweiAssistant/LaunchScreen.storyboard
      - path: MeiweiAssistant/title-catalog.json
      - path: ../../../shared/data/recipes.json
      - path: ../../../shared/data/titles.json
      - path: ../../../shared/data/mystic.json
      - path: ../../../shared/data/party-games.json
    info:
      path: MeiweiAssistant/Info.plist
      properties:
        CFBundleDisplayName: 美味助手
        LSApplicationCategoryType: public.app-category.food-and-drink
        UILaunchStoryboardName: LaunchScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cn.hnchpower.meiwei
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: 5.0
